<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Atlas CRM müşteri kayıt formu örneği</title>
  <desc id="desc">Sol menü, müşteri bilgileri formu ve kaydet kontrolünden oluşan temsili bir uygulama ekranı.</desc>
  <rect width="1440" height="900" fill="#f7f8f9"/>
  <rect width="1440" height="86" fill="#2d3942"/>
  <rect x="42" y="27" width="190" height="32" fill="#ffffff" opacity="0.92"/>
  <rect y="86" width="276" height="814" fill="#ffffff"/>
  <path d="M276 86v814" stroke="#d5d9dc" stroke-width="2"/>
  <rect x="36" y="138" width="170" height="18" fill="#42525e" opacity="0.8"/>
  <rect x="36" y="190" width="204" height="52" fill="#eef1f3"/>
  <rect x="54" y="207" width="126" height="18" fill="#42525e" opacity="0.72"/>
  <rect x="36" y="270" width="150" height="18" fill="#42525e" opacity="0.5"/>
  <rect x="36" y="314" width="180" height="18" fill="#42525e" opacity="0.5"/>
  <text x="336" y="166" fill="#2d3942" font-family="Arial, sans-serif" font-size="36" font-weight="700">Yeni Müşteri</text>
  <text x="336" y="210" fill="#42525e" font-family="Arial, sans-serif" font-size="18">Kuruluş ve iletişim bilgilerini girin.</text>
  <rect x="336" y="262" width="1044" height="500" fill="#ffffff" stroke="#d5d9dc" stroke-width="2"/>
  <text x="380" y="324" fill="#2d3942" font-family="Arial, sans-serif" font-size="22" font-weight="700">Kuruluş bilgileri</text>
  <g fill="#42525e" font-family="Arial, sans-serif" font-size="16">
    <text x="380" y="382">Müşteri türü</text>
    <text x="886" y="382">Ticaret unvanı</text>
    <text x="380" y="510">Vergi numarası</text>
    <text x="886" y="510">Ülke</text>
  </g>
  <g fill="#f7f8f9" stroke="#d5d9dc" stroke-width="2">
    <rect x="380" y="404" width="450" height="62"/>
    <rect x="886" y="404" width="450" height="62"/>
    <rect x="380" y="532" width="450" height="62"/>
    <rect x="886" y="532" width="450" height="62"/>
  </g>
  <g fill="#42525e" font-family="Arial, sans-serif" font-size="18">
    <text x="402" y="443">Kurumsal</text>
    <text x="908" y="443">Örnek Teknoloji A.Ş.</text>
    <text x="402" y="571">1234567890</text>
    <text x="908" y="571">Türkiye</text>
  </g>
  <rect x="1164" y="658" width="172" height="58" fill="#42525e"/>
  <text x="1250" y="695" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Kaydet</text>
  <text x="720" y="836" text-anchor="middle" fill="#42525e" font-family="Arial, sans-serif" font-size="18">Temsili ekran görüntüsü — gerçek ürün arayüzü değildir</text>
</svg>
